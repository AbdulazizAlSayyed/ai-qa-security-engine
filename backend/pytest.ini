[pytest]
testpaths = tests
# Every test in this suite is a function. Switching class collection off
# stops pytest trying to collect imported schemas whose names begin with
# "Test" - TestAccountResponse and friends - and warning that it cannot.
python_classes =
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers --tb=short
markers =
    integration: needs a MongoDB instance running on the configured MONGODB_URI
    playwright: needs Playwright, a browser, and a reachable target application
    security: needs a running OWASP ZAP and a reachable target application
